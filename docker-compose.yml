version: '3.8'

services:
  # 1. API Gateway (Ingress & Reverse Proxy)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tixora-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - EVENT_SERVICE_URL=http://event-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
      - PAYMENT_SERVICE_URL=http://payment-service:5005
      - JWT_SECRET=tixora_super_secret_jwt_key_2026
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - notification-service
      - payment-service
    networks:
      - tixora-network

  # 2. Auth & Identity Microservice
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tixora-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=tixora_super_secret_jwt_key_2026
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
    networks:
      - tixora-network

  # 3. Event Catalog Microservice
  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    container_name: tixora-event-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
    networks:
      - tixora-network

  # 4. Booking & Order Microservice
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: tixora-booking-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NODE_ENV=production
      - EVENT_SERVICE_URL=http://event-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
      - AUTH_SERVICE_URL=http://auth-service:5001
    depends_on:
      - event-service
      - notification-service
    networks:
      - tixora-network

  # 5. Notification & Messaging Microservice
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: tixora-notification-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - NODE_ENV=production
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password
    networks:
      - tixora-network

  # 6. Payment & Settlement Microservice
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: tixora-payment-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NODE_ENV=production
    networks:
      - tixora-network

  # 7. React Frontend (Web UI)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tixora-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    networks:
      - tixora-network

networks:
  tixora-network:
    driver: bridge
