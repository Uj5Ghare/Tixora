# helm upgrade argocd argo/argo-cd  -f infra/valuefiles/argocd-values.yaml
#
# EKS: do not use kops-only tolerations here or Argo CD pods will not schedule.
# Public UI: Terragrunt sets expose_server_via_internet_facing_nlb (NLB). After deploy, set
# configs.cm.url in Argo CD to https://<NLB hostname> for correct links / notifications.

global:
  tolerations:
    - key: "eks.k8s.io/instance"
      operator: "Equal"
      value: "tixora-api"
      effect: "NoSchedule"

# server.service (LoadBalancer / NLB) is applied last from Terraform when expose_server_via_internet_facing_nlb is true.
server:
  ingress:
    annotations:
      # Keep this in values (not helm --set) to avoid comma parsing issues in Terraform helm_set.
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

# RBAC users policy
configs:
  rbac: 
    policy.default: role:readonly
    policy.csv: |
      p, role:readonly, applications, get, */*, allow
# Configmap for argocd-users
  cm:
    # Public URL (must match ingress hostname / DNS). Used for UI links and webhooks.
    url: https://gitops-argocd.tixora.com
    timeout.reconciliation: 5s
    accounts.viewer: login
    accounts.viewer.enabled: "true"
    
# Notifications controller
notifications:
  enabled: true
  secret:
    create: true
    items:
      # Do not commit real tokens. Set via Sealed Secrets / External Secrets / kubectl after install.
      slack-token: "PLACEHOLDER_SLACK_TOKEN"
  notifiers:
    service.slack: |
      token: $slack-token
  subscriptions:
    - recipients:
        - slack:tixora-argocd
      triggers:
        - on-sync-succeeded
        - on-sync-status-unknown
        - on-sync-failed
        - on-health-degraded
        # - on-sync-running
        # - on-deployed
    # # subscription restricted to applications with matching labels only
    # - recipients:
    #   - slack:test3
    #   selector: test=true
    #   triggers:
    #   - on-sync-status-unknown

  templates:
